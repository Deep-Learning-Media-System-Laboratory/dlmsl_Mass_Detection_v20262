# Ultralytics YOLOv8-MS port matching the official MMYOLO architecture flow
# Official YOLO-MS releases N/S/M scales only.

nc: 80
reg_max: 16
end2end: False

scales:
  # [depth, width, max_channels]
  n: [0.33, 0.16, 1280]
  s: [0.33, 0.35, 1280]
  m: [0.33, 0.50, 1280]

backbone:
  # One backbone module preserves the single shared GQL query used by stages 2-4.
  # args: [depth, width, last_stage_channels, query_length, query_size,
  #        msblock_layers_num, mid_expand_ratio, start_branch_id]
  - [-1, 1, YOLOMSBackbone, [depth, width, 1280, 3, 4, 3, 2.0, 2]] # 0 -> (P3, P4, P5)

  # Extract P3/8, P4/16, P5/32. Base channel values are width-scaled by parse_model.
  - [0, 1, MSIndex, [320, 0]]  # 1 P3/8
  - [0, 1, MSIndex, [640, 1]]  # 2 P4/16
  - [0, 1, MSIndex, [1280, 2]] # 3 P5/32

head:
  # Top-down: P5 -> P4, official kernel schedule (1, 5, 5)
  - [3, 1, nn.Upsample, [None, 2, "nearest"]] # 4
  - [[-1, 2], 1, Concat, [1]]                 # 5
  - [-1, 1, MSBlock, [640, [1, 5, 5], 0.5, 2.0, 1, 2]] # 6

  # Top-down: P4 -> P3, official kernel schedule (1, 3, 3)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 7
  - [[-1, 1], 1, Concat, [1]]                 # 8
  - [-1, 1, MSBlock, [320, [1, 3, 3], 0.5, 2.0, 1, 2]] # 9 P3/8

  # Bottom-up: P3 -> P4, official kernel schedule (1, 5, 5)
  - [-1, 1, Conv, [320, 3, 2]]                # 10
  - [[-1, 6], 1, Concat, [1]]                 # 11
  - [-1, 1, MSBlock, [640, [1, 5, 5], 0.5, 2.0, 1, 2]] # 12 P4/16

  # Bottom-up: P4 -> P5, official kernel schedule (1, 7, 7)
  - [-1, 1, Conv, [640, 3, 2]]                # 13
  - [[-1, 3], 1, Concat, [1]]                 # 14
  - [-1, 1, MSBlock, [1280, [1, 7, 7], 0.5, 2.0, 1, 2]] # 15 P5/32

  # Scale-dependent decoupled head:
  # P3: 3x3 -> 3x3
  # P4: grouped 5x5 -> 3x3
  # P5: grouped 7x7 -> 3x3
  - [[9, 12, 15], 1, YOLOMSDetect,
     [nc, [4, 4, 4], [[3, 3], [5, 3], [7, 3]], [[3, 3], [5, 3], [7, 3]]]]
